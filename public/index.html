<!DOCTYPE html>
<html>
<head>
    <title>ITER Bus Tracker - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>ITER Bus Tracker</h2>
        <select id="role">
            <option value="student">I am a Student</option>
            <option value="driver">I am a Driver</option>
        </select>
        <input type="text" id="userId" placeholder="Enter College ID or Bus Pin">
        <button onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            const role = document.getElementById('role').value;
            const id = document.getElementById('userId').value;

            if (role === 'student') {
                // Regex: Checks if it's a 10-digit student ID
                if (/^[0-9]{10}$/.test(id)) {
                    window.location.href = `/student.html?id=${id}`;
                } else {
                    alert("Please enter a valid 10-digit College ID");
                }
            } else {
                // Simple Driver Pin check (Change '9999' to whatever you want)
                if (id === '9999') {
                    window.location.href = '/driver.html';
                } else {
                    alert("Incorrect Driver Pin");
                }
            }
        }
    </script>
</body>
</html>
