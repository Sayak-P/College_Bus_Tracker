<!DOCTYPE html>
<html>
<head>
    <title>Driver - Location Sender</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #status { font-weight: bold; color: #d9534f; margin: 20px; }
        .btn { padding: 15px 30px; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Bus Driver Dashboard</h2>
    <div id="status">Status: Not Tracking</div>
    <button class="btn" onclick="startTracking()">Start Sharing Location</button>

    <script>
        const socket = io();
        let watchId = null;

        function startTracking() {
            if (!navigator.geolocation) {
                alert("GPS is not supported by your browser.");
                return;
            }

            document.getElementById('status').innerText = "Status: Tracking Active...";
            document.getElementById('status').style.color = "green";

            // watchPosition sends updates automatically when the bus moves
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const data = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        routeId: "Route-1" // You can make this dynamic later
                    };
                    
                    console.log("Sending location:", data);
                    socket.emit('send-location', data);
                },
                (error) => {
                    console.error(error);
                    alert("Error getting location. Please enable GPS.");
                },
                { enableHighAccuracy: true }
            );
        }
    </script>
</body>
</html>
